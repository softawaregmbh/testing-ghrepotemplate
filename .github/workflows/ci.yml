name: CI

# Runs on pull requests and is reused by the deploy workflow as a quality gate.
# There is deliberately no "push" trigger: the deploy workflow calls this one,
# so a push to main would otherwise build everything twice.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      # The AppHost starts the SPA dev server, and installs its npm packages itself.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Create the development certificate
        # The integration tests call the backend over HTTPS, so Kestrel needs a
        # certificate to bind to. The tests themselves don't validate it.
        run: dotnet dev-certs https

      - name: Build
        run: dotnet build TestingGhrepotemplate.slnx -c Release

      - name: Test
        # Starts the AppHost, so Docker is required. It is preinstalled on the
        # GitHub-hosted Ubuntu runners. The AppHost parameters come from user
        # secrets locally, which don't exist here.
        run: dotnet test TestingGhrepotemplate.slnx -c Release --no-build
        env:
          Parameters__EfExtensionsLicenseName: ${{ secrets.EF_EXTENSIONS_LICENSE_NAME }}
          Parameters__EfExtensionsLicenseKey: ${{ secrets.EF_EXTENSIONS_LICENSE_KEY }}
          Parameters__TelerikLicense: ${{ secrets.TELERIK_LICENSE }}
          Parameters__FontAwesomeNpmAuthToken: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
